[project]
name = "molt-server"
version = "0.1.0"
description = "Molt MCP server audits Python projects managed by uv."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "chromadb>=1.5.9",
    "fastmcp>=3.4.6",
    "langchain>=1.3.14",
    "langchain-anthropic>=1.6.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.0",
    "license-expression>=30.4.4",
    "loguru>=0.7.3",
    "opik>=2.2.23",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
# Evals call a real LLM and cost money: opt in with `pytest -m eval`.
addopts = "-m 'not eval'"
markers = ["eval: runs the golden dataset against a real LLM (costs money, needs credentials)"]
